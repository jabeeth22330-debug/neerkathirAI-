<script>

const Q=[

 ["na","Not sure","உறுதியாக தெரியவில்லை"]]},

{id:"wx",en:"Recent weather",ta:"சமீபத்திய வானிலை",o:[["wet","Cool, rainy, humid","குளிர், மழை, ஈரப்பதம்"],["dry","Dry / hot","வறண்ட / வெப்பம்"]]},
{id:"nb",en:"Nearby plants also affected?",ta:"அருகிலுள்ள செடிகளும் பாதிப்பா?",o:[["y","Yes","ஆம்"],["n","No","இல்லை"]]}];
const D={
early:{en:"Early blight (possible)",ta:"முன் கருகல் நோய் (சாத்தியம்)",urg:1,
 adv:{en:["Remove and bag badly affected lower leaves; do not compost them.","Water at the base, avoid wetting leaves; add mulch.","Rotate with a non-solanaceous crop next season.","Ask the agricultural officer which approved product and dose suits your area."],
 ta:["மிகவும் பாதித்த கீழ் இலைகளை அகற்றி பையில் போடவும்; உரமாக்க வேண்டாம்.","இலைகளை நனைக்காமல் வேரில் நீர் பாய்ச்சவும்; மூடாக்கு இடவும்.","அடுத்த பருவத்தில் தக்காளி குடும்பம் அல்லாத பயிரை சுழற்சி செய்யவும்.","உங்கள் பகுதிக்கு ஏற்ற அனுமதிக்கப்பட்ட மருந்து மற்றும் அளவை வேளாண் அலுவலரிடம் கேட்கவும்."]}},
late:{en:"Late blight (possible)",ta:"பின் கருகல் நோய் (சாத்தியம்)",urg:3,
 adv:{en:["This can spread very fast in wet weather: contact an agricultural officer today.","Remove and bag affected plants/leaves carefully; avoid moving through wet crop.","Avoid overhead irrigation.","Do not use any chemical without expert-confirmed product and dose."],
 ta:["ஈரமான வானிலையில் மிக வேகமாக பரவும்: இன்றே வேளாண் அலுவலரைத் தொடர்பு கொள்ளவும்.","பாதித்த செடி/இலைகளை கவனமாக அகற்றி பையில் போடவும்; ஈரமான பயிரில் நடமாடுவதை தவிர்க்கவும்.","மேலிருந்து நீர் தெளிப்பதை தவிர்க்கவும்.","நிபுணர் உறுதி செய்யாமல் எந்த ரசாயனத்தையும் பயன்படுத்த வேண்டாம்."]}},
sept:{en:"Septoria leaf spot (possible)",ta:"செப்டோரியா இலைப்புள்ளி (சாத்தியம்)",urg:1,
 adv:{en:["Remove spotted lower leaves and keep foliage dry.","Space plants for air flow; clear weeds and plant debris.","Monitor weekly and record photos here.","Confirm with an agricultural officer before any spray."],
 ta:["புள்ளி உள்ள கீழ் இலைகளை அகற்றி இலைகளை உலர்வாக வைக்கவும்.","காற்றோட்டத்திற்கு இடைவெளி விடவும்; களை மற்றும் கழிவுகளை அகற்றவும்.","வாரந்தோறும் கண்காணித்து இங்கே புகைப்படம் பதிவு செய்யவும்.","எந்த தெளிப்புக்கும் முன் வேளாண் அலுவலரிடம் உறுதி செய்யவும்."]}},
curl:{en:"Leaf curl virus (possible)",ta:"இலை சுருட்டை வைரஸ் (சாத்தியம்)",urg:2,
 adv:{en:["Remove and destroy infected young plants early.","Whiteflies spread it: use yellow sticky traps and keep field weed-free.","Use virus-tolerant seedlings and nets in nurseries next time.","Ask the agricultural officer about whitefly control options."],
 ta:["பாதித்த இளம் செடிகளை முன்கூட்டியே அகற்றி அழிக்கவும்.","வெள்ளை ஈ பரப்புகிறது: மஞ்சள் ஒட்டுப் பொறிகள் வைத்து களை இல்லாமல் வைக்கவும்.","அடுத்த முறை வைரஸ் தாங்கும் நாற்றுகள், நாற்றங்காலில் வலை பயன்படுத்தவும்.","வெள்ளை ஈ கட்டுப்பாடு பற்றி வேளாண் அலுவலரிடம் கேட்கவும்."]}},
healthy:{en:"No clear disease seen",ta:"தெளிவான நோய் இல்லை",urg:0,
 adv:{en:["Keep monitoring weekly.","Maintain balanced watering and spacing."],ta:["வாரந்தோறும் கண்காணிக்கவும்.","சமநிலையான நீர்ப்பாசனம், இடைவெளி பராமரிக்கவும்."]}}};
function score(a){const s={early:0,late:0,sept:0,curl:0};
 const m={ring:{early:3},wet:{late:3},small:{sept:3},curl:{curl:3}};
 if(m[a.sym])for(const k in m[a.sym])s[k]+=m[a.sym][k];
 if(a.loc==="old"){s.early+=1;s.sept+=1}if(a.loc==="young"){s.curl+=1}
 if(a.wx==="wet"){s.late+=1;s.sept+=.5;s.early+=.5}if(a.wx==="dry"){s.curl+=.5}
 if(a.nb==="y"){s.late+=.5;s.curl+=.5}
 return Object.entries(s).sort((x,y)=>y[1]-x[1]);}
function setLang(l){L=l;$("lang").value=l;draw();guideInit();if(cur)show();authRender();if(!$("v-profile").classList.contains("hide"))profileView()}
function draw(){const t=k=>T[k][L];$("tag").textContent=t("tag");$("t-set").textContent=t("set");$("t-kiosk").textContent=t("kiosk");
 $("t-crop").textContent=t("crop");$("t-photo").textContent=t("photo");$("t-snap").textContent=t("snap");$("t-q").textContent=t("q");$("t-go").textContent=t("go");$("t-sample").textContent=L==="ta"?"மாதிரி இலையை பயன்படுத்து":"Use a sample leaf";
 ["scan","hist","profile","about"].forEach(k=>$("n-"+k).textContent=t(k));
 const c=$("crop"),v=c.value||"tomato";c.innerHTML=Object.entries(CROPS).map(([k,o])=>`<option value="${k}">${o[L]}${o.ok?"":" 🔒"}</option>`).join("");c.value=v;
 if(!img)$("imgmsg").textContent=t("nophoto");
 $("qs").innerHTML=Q.map(q=>`<b>${q[L]}</b>`+q.o.map((o,i)=>`<label class="opt"><input type="radio" name="${q.id}" value="${o[0]}" ${(document.querySelector(`input[name=${q.id}]:checked`)?.value===o[0])?"checked":""}>${o[L==="ta"?2:1]}</label>`).join("")).join("<br>");
 cropChg();if(!$("v-hist").classList.contains("hide"))hist();if(!$("v-about").classList.contains("hide"))about();}
function cropChg(){const o=CROPS[$("crop").value],m=$("cropmsg");$("flow").classList.toggle("hide",!o.ok);
 m.classList.toggle("hide",!!o.ok);m.textContent=L==="ta"?"இந்த பயிருக்கு இன்னும் சரிபார்க்கப்பட்ட மாதிரி இல்லை. நோயை ஊகிக்க மாட்டோம்; வேளாண் அலுவலரை அணுகவும்.":"No validated model for this crop yet. We will not guess — please consult an agricultural officer.";}
function setImage(src){const im=new Image();im.onload=()=>{img=im;$("pv").src=src;$("pv").classList.remove("hide");const c=document.createElement("canvas");c.width=96;c.height=Math.max(1,Math.round(96*im.height/im.width));c.getContext("2d").drawImage(im,0,0,c.width,c.height);thumb=c.toDataURL("image/jpeg",.6);$("imgmsg").textContent="✔"};im.src=src}
$("file").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>setImage(r.result);r.readAsDataURL(f)});
function sampleLeaf(){const c=document.createElement("canvas");c.width=c.height=400;const x=c.getContext("2d");x.fillStyle="#cfcfcf";x.fillRect(0,0,400,400);
 x.fillStyle="#3c8c32";x.beginPath();x.ellipse(200,200,150,185,0.3,0,7);x.fill();
 x.fillStyle="#96641e";[[140,150,22],[230,210,28],[190,290,18],[260,120,16],[150,250,20]].forEach(p=>{x.beginPath();x.arc(p[0],p[1],p[2],0,7);x.fill()});
 x.fillStyle="#d4b830";[[205,150,14],[120,210,12]].forEach(p=>{x.beginPath();x.arc(p[0],p[1],p[2],0,7);x.fill()});setImage(c.toDataURL("image/jpeg",.9))}
function toast(m){let d=$("toast");if(!d){d=document.createElement("div");d.id="toast";d.style.cssText="position:fixed;left:12px;right:12px;bottom:76px;background:#2e7d32;color:#fff;padding:12px;border-radius:10px;text-align:center;z-index:40";document.body.appendChild(d)}d.textContent=m;d.style.display="block";clearTimeout(d._t);d._t=setTimeout(()=>d.style.display="none",2500)}
function doPrint(){try{window.print()}catch(e){toast("Print not available here")}}
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const m=el.getAttribute("data-a").match(/^(\w+)\((.*)\)$/);if(!m||typeof window[m[1]]!=="function")return;const a=m[2]===""?[]:m[2].split(",").map(v=>{v=v.trim().replace(/^'|'$/g,"");return /^\d+$/.test(v)?+v:v});window[m[1]](...a)});
$("lang").addEventListener("change",e=>setLang(e.target.value));$("crop").addEventListener("change",cropChg);
$("kiosk").addEventListener("change",e=>document.body.classList.toggle("kiosk",e.target.checked));
function severity(im){const W=128,H=Math.max(1,Math.round(128*im.height/im.width)),c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.drawImage(im,0,0,W,H);
 const d=x.getImageData(0,0,W,H).data;let g=0,s=0;
 for(let i=0;i<d.length;i+=4){const r=d[i]/255,gr=d[i+1]/255,b=d[i+2]/255,mx=Math.max(r,gr,b),mn=Math.min(r,gr,b),df=mx-mn;if(mx<.15||mx>.97||df/mx<.25)continue;
  let h=df===0?0:mx===r?((gr-b)/df%6)*60:mx===gr?((b-r)/df+2)*60:((r-gr)/df+4)*60;if(h<0)h+=360;
  if(h>=70&&h<=170)g++;else if(h>=10&&h<70)s++;}
 const leaf=g+s,frac=leaf/(W*H),pct=leaf?100*s/leaf:0;return{pct:Math.round(pct),leafFrac:frac};}
function analyse(){if(!img){toast(T.nophoto[L]);return}
 const a={};Q.forEach(q=>a[q.id]=document.querySelector(`input[name=${q.id}]:checked`)?.value||null);
 sev=severity(img);const rk=score(a),top=rk[0],sec=rk[1];
 let key,conf,unsure=false;
 if(sev.leafFrac<.12){unsure=true;key=null;conf=0}

function advice(c){const lines=[];

  if(c.key&&c.key!=="healthy")lines.push((L==="ta"?"சாத்தியமான காரணம்: ":"Possibilities: ")+c.alt.map(k=>D[k][L]).join(" / "))}
 else lines.push(...D[c.key].adv[L]);
 lines.push(L==="ta"?"இது முன்னோட்ட AI ஆய்வு மட்டுமே; உறுதிப்படுத்தப்பட்ட நோயறிதல் அல்ல.":"This is a preliminary AI screening, not a confirmed diagnosis.");return lines}

 let cmp="";if(followOf){const p=followOf,d=c.pct-p.pct,w=Math.abs(d)<=5?(L==="ta"?"ஒத்த நிலை":"Similar"):d>0?(L==="ta"?"தெரியும் அறிகுறிகள் அதிகரித்துள்ளன":"Visible symptoms appear increased"):(L==="ta"?"தெரியும் அறிகுறிகள் குறைந்துள்ளன":"Visible symptoms appear reduced");
  cmp=`<div class="card"><h2>${L==="ta"?"முந்தைய பதிவுடன் ஒப்பீடு":"Follow-up comparison"} (${p.id})</h2><div class="row"><span>${p.pct}% → <b>${c.pct}%</b></span><span class="tag unk">${w}</span></div><p class="mu">${L==="ta"?"வெளிச்சம்/கோணம் மாறினால் ஒப்பீடு தவறாகலாம். சிகிச்சை பலனளித்தது என்று இதை மட்டும் வைத்து முடிவு செய்யாதீர்கள்.":"Different light or angle can change results. Do not conclude a treatment worked from this alone."}</p></div>`}

ில் இலை அடியில் வெள்ளை பூஞ்சை."},"actions":{"en":["This can spread very fast in wet weather: contact an agricultural officer today.","Remove and bag affected plants/leaves carefully; avoid moving through wet crop.","Avoid overhead irrigation.","Do not use any chemical without expert-confirmed product and dose."],"ta":["ஈரமான வானிலையில் மிக வேகமாக பரவும்: இன்றே வேளாண் அலுவலரைத் தொடர்பு கொள்ளவும்.","பாதித்த செடி/இலைகளை கவனமாக அகற்றி பையில் போடவும்; ஈரமான பயிரில் நடமாடுவதை தவிர்க்கவும்.","மேலிருந்து நீர் தெளிப்பதை தவிர்க்கவும்.","நிபுணர் உறுதி செய்யாமல் எந்த ரசாயனத்தையும் பயன்படுத்த வேண்டாம்."]},"refer_when":{"en":"Symptoms spread fast, many plants are affected, or you are not sure.","ta":"அறிகுறிகள் வேகமாக பரவினால், பல செடிகள் பாதித்தால், அல்லது உறுதியில்லையெனில்."},"sources":[],"status":"draft_pending_expert_review","products":[]},{"id":"septoria_leaf_spot","type":"disease","crop":"tomato","name":{"en":"Septoria leaf spot","ta":"செப்டோரியா இலைப்புள்ளி"},"symptoms":{"en":"Many small round spots with grey centres and dark edges.","ta":"சாம்பல் மையமும் கருமை விளிம்பும் உள்ள பல சிறிய வட்டப் புள்ளிகள்."},"actions":{"en":["Remove spotted lower leaves and keep foliage dry.","Space plants for air flow; clear weeds and plant debris.","Monitor weekly and record photos here.","Confirm with an agricultural officer before any spray."],"ta":["புள்ளி உள்ள கீழ் இலைகளை அகற்றி இலைகளை உலர்வாக வைக்கவும்.","காற்றோட்டத்திற்கு இடைவெளி விடவும்; களை மற்றும் கழிவுகளை அகற்றவும்.","வாரந்தோறும் கண்காணித்து இங்கே புகைப்படம் பதிவு செய்யவும்.","எந்த தெளிப்புக்கும் முன் வேளாண் அலுவலரிடம் உறுதி செய்யவும்."]},"refer_when":{"en":"Symptoms spread fast, many plants are affected, or you are not sure.","ta":"அறிகுறிகள் வேகமாக பரவினால், பல செடிகள் பாதித்தால், அல்லது உறுதியில்லையெனில்."},"sources":[],"status":"draft_pending_expert_review","products":[]},{"id":"leaf_curl_virus","type":"disease","crop":"tomato","name":{"en":"Leaf curl virus","ta":"இலை சுருட்டை வைரஸ்"},"symptoms":{"en":"Leaves curl upward, turn yellow and stay small.","ta":"இலைகள் மேல்நோக்கி சுருண்டு, மஞ்சளாகி, சிறியதாக இருக்கும்."},"actions":{"en":["Remove and destroy infected young plants early.","Whiteflies spread it: use yellow sticky traps and keep field weed-free.","Use virus-tolerant seedlings and nets in nurseries next time.","Ask the agricultural officer about whitefly control options.","Raise seedlings under a net or other protected cover.","Grow sorghum, maize or bajra as a border (barrier) crop.","Remove the weed Abutilon indicum, which hosts whiteflies."],"ta":["பாதித்த இளம் செடிகளை முன்கூட்டியே அகற்றி அழிக்கவும்.","வெள்ளை ஈ பரப்புகிறது: மஞ்சள் ஒட்டுப் பொறிகள் வைத்து களை இல்லாமல் வைக்கவும்.","அடுத்த முறை வைரஸ் தாங்கும் நாற்றுகள், நாற்றங்காலில் வலை பயன்படுத்தவும்.","வெள்ளை ஈ கட்டுப்பாடு பற்றி வேளாண் அலுவலரிடம் கேட்கவும்.","நாற்றுகளை வலை அல்லது பாதுகாப்பான மூடிய இடத்தில் வளர்க்கவும்.","எல்லைப் பயிராக சோளம், மக்காச்சோளம் அல்லது கம்பு வளர்க்கவும்.","வெள்ளை ஈக்களுக்கு தங்குமிடமான துத்தி (Abutilon indicum) களையை அகற்றவும்."]},"refer_when":{"en":"Symptoms spread fast, many plants are affected, or you are not sure.","ta":"அறிகுறிகள் வேகமாக பரவினால், பல செடிகள் பாதித்தால், அல்லது உறுதியில்லையெனில்."},"sources":[{"name":"TNAU Agritech Portal","url":"https://agritech.tnau.ac.in/crop_protection/tomato_diseases_6.html","updated":"Jun 2023"}],"status":"draft_pending_expert_review","products":[{"kind":"chemical","name":"Dimethoate","note":{"en":"Listed for controlling the whitefly that spreads this virus. It does not cure infected plants.","ta":"இந்த வைரஸை பரப்பும் வெள்ளை ஈ கட்டுப்பாட்டுக்காக பட்டியலிடப்பட்டது. பாதித்த செடிகளை குணப்படுத்தாது."},"source":{"name":"TNAU Agritech Portal","url":"https://agritech.tnau.ac.in/crop_protection/tomato_diseases_6.html","updated":"Jun 2023"},"show_dose":false,"status":"source_listed_needs_registration_check"},{"kind":"chemical","name":"Methyl demeton","note":{"en":"Listed for controlling the whitefly that spreads this virus. It does not cure infected plants.","ta":"இந்த வைரஸை பரப்பும் வெள்ளை ஈ கட்டுப்பாட்டுக்காக பட்டியலிடப்பட்டது. பாதித்த செடிகளை குணப்படுத்தாது."},"source":{"name":"TNAU Agritech Portal","url":"https://agritech.tnau.ac.in/crop_protection/tomato_diseases_6.html","updated":"Jun 2023"},"show_dose":false,"status":"source_listed_needs_registration_check"},{"kind":"chemical","name":"Thiamethoxam","note":{"en":"Listed for controlling the whitefly that spreads this virus. It does not cure infected plants.","ta":"இந்த வைரஸை பரப்பும் வெள்ளை ஈ கட்டுப்பாட்டுக்காக பட்டியலிடப்பட்டது. பாதித்த செடிகளை குணப்படுத்தாது."},"source":{"name":"TNAU Agritech Portal","url":"https://agritech.tnau.ac.in/crop_protection/tomato_diseases_6.html","updated":"Jun 2023"},"show_dose":false,"status":"source_listed_needs_registration_check"},{"kind":"chemical","name":"Imidacloprid","note":{"en":"Listed for controlling the whitefly that spreads this virus. It does not cure infected plants.","ta":"இந்த வைரஸை பரப்பும் வெள்ளை ஈ கட்டுப்பாட்டுக்காக பட்டியலிடப்பட்டது. பாதித்த செடிகளை குணப்படுத்தாது."},"source":{"name":"TNAU Agritech Portal","url":"https://agritech.tnau.ac.in/crop_protection/tomato_diseases_6.html","updated":"Jun 2023"},"show_dose":false,"status":"source_listed_needs_registration_check"}]},{"id":"whitefly","type":"pest","crop":"tomato","name":{"en":"Whitefly","ta":"வெள்ளை ஈ"},"symptoms":{"en":"Tiny white flies under leaves; sticky leaves; yellowing; can spread leaf curl virus.","ta":"இலைகளின் அடியில் சிறிய வெள்ளை ஈக்கள்; இலைகள் ஒட்டும்; மஞ்சளாதல்; இலை சுருட்டை வைரஸை பரப்பலாம்."},"actions":{"en":["Hang yellow sticky traps near the plants.","Remove and destroy heavily infested leaves and weeds nearby.","Check the underside of leaves every week.","Ask the agricultural officer which approved control suits your crop stage.","Use nitrogen fertiliser and irrigation carefully; too much favours whiteflies.","Uproot and destroy plants showing leaf curl."],"ta":["செடிகளுக்கு அருகே மஞ்சள் ஒட்டுப் பொறிகளை தொங்கவிடவும்.","அதிகம் தாக்கிய இலைகளையும் அருகிலுள காய்ப்புழு"},"symptoms":{"en":"Round holes in fruits with caterpillars inside; damaged flowers.","ta":"காய்களில் வட்ட துளைகள், உள்ளே புழுக்கள்; சேதமடைந்த பூக்கள்."},"actions":{"en":["Collect and destroy damaged fruits and caterpillars by hand.","Use pheromone traps to monitor moths.","Do not leave damaged fruits in the field.","Ask the agricultural officer for approved control options before spraying."],"ta":["சேதமடைந்த காய்களையும் புழுக்களையும் கையால் சேகரித்து அழிக்கவும்.","அந்துப்பூச்சிகளை கண்காணிக்க இனக்கவர்ச்சிப் பொறிகளை பயன்படுத்தவும்.","சேதமடைந்த காய்களை வயலில் விடாதீர்கள்.","தெளிப்பதற்கு முன் அனுமதிக்கப்பட்ட கட்டுப்பாட்டு முறைகளை வேளாண் அலுவலரிடம் கேட்கவும்."]},"refer_when":{"en":"Symptoms spread fast, many plants are affected, or you are not sure.","ta":"அறிகுறிகள் வேகமாக பரவினால், பல செடிகள் பாதித்தால், அல்லது உறுதியில்லையெனில்."},"sources":[],"status":"draft_pending_expert_review","products":[]},{"id":"red_spider_mite","type":"pest","crop":"tomato","name":{"en":"Red spider mite","ta":"சிவப்புச் சிலந்திப் பூச்சி"},"symptoms":{"en":"Tiny speckles and bronzing on leaves, fine webbing; worse in hot, dry weather.","ta":"இலைகளில் சிறிய புள்ளிகள், வெண்கல நிறம், மெல்லிய வலை; வெப்பமான வறண்ட வானிலையில் அதிகம்."},"actions":{"en":["Check the underside of leaves with a magnifier.","Keep irrigation regular and avoid dusty, water-stressed plants.","Remove badly affected leaves.","Ask the agricultural officer for approved mite control."],"ta":["பூதக்கண்ணாடியால் இலையின் அடிப்பகுதியை பரிசோதிக்கவும்.","நீர்ப்பாசனத்தை சீராக வைக்கவும்; தூசி படிந்த, நீர் பற்றாக்குறை உள்ள செடிகளை தவிர்க்கவும்.","மிகவும் பாதித்த இலைகளை அகற்றவும்.","அனுமதிக்கப்பட்ட சிலந்திப்பூச்சி கட்டுப்பாட்டை வேளாண் அலுவலரிடம் கேட்கவும்."]},"refer_when":{"en":"Symptoms spread fast, many plants are affected, or you are not sure.","ta":"அறிகுறிகள் வேகமாக பரவினால், பல செடிகள் பாதித்தால், அல்லது உறுதியில்லையெனில்."},"sources":[],"status":"draft_pending_expert_review","products":[]},{"id":"irrigation_advice","type": ft_pending_expert_review","products":[]},{"id":"blossom_end_rot","type":"nutrient_disorder","crop":"tomato","name":{"en":"Blossom end rot (calcium problem)","ta":"பூ முனை அழுகல் (கால்சியம் குறைபாடு)"},"symptoms":{"en":"A sunken, dark, leathery patch at the blossom end of young fruits. It does not spread from plant to plant.","ta":"இளம் காய்களின் பூ முனையில் மூழ்கிய, கருமையான, தோல் போன்ற திட்டு. செடியிலிருந்து செடிக்கு பரவாது."},"actions":{"en":["Keep soil moisture even; avoid long dry spells followed by heavy watering.","Mulch the soil.","Do a soil test and fertilise as it recommends; too much nitrogen reduces calcium uptake.","Fertiliser alone will not fix it if watering is uneven."],"ta":["மண் ஈரத்தை சீராக வைக்கவும்; நீண்ட வறட்சிக்குப் பின் அதிக நீர் பாய்ச்சுவதை தவிர்க்கவும்.","மண்ணில் மூடாக்கு இடவும்.","மண் பரிசோதனை செய்து அதன் பரிந்துரைப்படி உரமிடவும்; அதிக நைட்ரஜன் கால்சியம் உறிஞ்சுதலை குறைக்கும்.","நீர்ப்பாசனம் சீராக இல்லாவிட்டால் உரம் மட்டும் தீர்வாகாது."]},"refer_when":{"en":"Many fruits are affected, or you are not sure it is a calcium problem.","ta":"பல காய்கள் பாதித்தால், அல்லது கால்சியம் பிரச்சினை என்று உறுதியில்லையெனில்."},"sources":[{"name":"TNAU Agritech Portal","url":"https://agritech.tnau.ac.in/horticulture/plant_nutri/tomato_cal.html","updated":"Jan 2023"},{"name":"UConn Home & Garden Education Center (water and nutrient management)","url":"https://homegarden.cahnr.uconn.edu/?p=17959","updated":"n/a"}],"status":"draft_pending_expert_review","products":[{"kind":"fertiliser","name":"Calcium sulphate (soil application)","note":{"en":"Corrects a calcium shortage in the soil. Use only after a soil test or officer advice.","ta":"மண்ணில் கால்சியம் பற்றாக்குறையை சரிசெய்யும். மண் பரிசோதனை அல்லது அதிகாரி ஆலோசனைக்குப் பிறகே பயன்படுத்தவும்."},"source":{"name":"TNAU Agritech Portal","url":"https://agritech.tnau.ac.in/horticulture/plant_nutri/tomato_cal.html","updated":"Jan 2023"},"show_dose":false,"status":"source_listed_needs_registration_check"},{"kind":"fertiliser","name":"Calcium chloride (foliar spray)","note":{"en":"A short-term emergency measure; does not replace even watering.","ta":"குறுகிய கால அவசர நடவடிக்கை; சீரான நீர்ப்பாசனத்திற்கு மாற்று அல்ல."},"source":{"name":"TNAU Agritech Portal","url":"https://agritech.tnau.ac.in/horticulture/plant_nutri/tomato_cal.html","updated":"Jan 2023"},"show_dose":false,"status":"source_listed_needs_registration_check"}]}]};

const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),unb64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function keyFrom(pin,salt){const km=await crypto.subtle.importKey("raw",ENC.encode(pin),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function seal(o,key){const iv=crypto.getRandomValues(new Uint8Array(12));return b64(iv)+"."+b64(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,ENC.encode(JSON.stringify(o))))}
async function unseal(str,key){const [i,c]=str.split(".");return JSON.parse(DEC.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(i)},key,unb64(c))))}
let user=null,guestMode=false,amode="login",lastAct=Date.now(),wipeArm=0;
const profiles=()=>{try{return JSON.parse(LS.g("nk_profiles")||"[]")}catch(e){return[]}};
const field=(id,lab,val,type,ex)=>`<label class="mu">${lab}</label><input class="f" id="${id}" type="${type||"text"}" value="${esc(val)}" ${ex||""}>`;
const cropOpts=sel=>Object.entries(CROPS).map(([k,o])=>`<option value="${k}" ${k===sel?"selected":""}>${o[L]}</option>`).join("");
function detailFields(p,d){d=d||{};return field(p+"name",_("Full name","முழு பெயர்"),d.name,"text",'autocomplete="off" maxlength="60"')+field(p+"vil",_("Village / district","கிராமம் / மாவட்டம்"),d.vil,"text",'maxlength="60"')+field(p+"ph",_("Phone (optional)","தொலைபேசி (விருப்பம்)"),d.ph,"tel",'inputmode="numeric" maxlength="12"')+field(p+"ac",_("Land in acres (optional)","நிலம் ஏக்கரில் (விருப்பம்)"),d.ac,"text",'inputmode="decimal" maxlength="6"')+`<label class="mu">${_("Main crop","முக்கிய பயிர்")}</label><select id="${p}crop">${cropOpts(d.crop)}</select><br><br>`}
function readDetails(p){return{name:$(p+"name").value.trim(),vil:$(p+"vil").value.trim(),ph:$(p+"ph").value.trim(),ac:$(p+"ac").value.trim(),crop:$(p+"crop").value}}
function checkDetails(d){if(d.name.length<2||d.vil.length<2)return _("Enter your name and village.","பெயர் மற்றும் கிராமத்தை உள்ளிடவும்.");if(d.ph&&!/^\d{10,12}$/.test(d.ph))return _("Phone must be 10–12 digits.","தொலைபேசி 10–12 இலக்கங்கள் இருக்க வேண்டும்.");if(d.ac&&!/^\d{1,3}(\.\d{1,2})?$/.test(d.ac))return _("Enter land as a number, e.g. 2.5","நிலத்தை எண்ணாக உள்ளிடவும், எ.கா. 2.5");return""}
const aerr=t=>{const m=$("a-msg");if(m){m.textContent=t;m.style.color="var(--er)"}};
function authRender(){const a=$("auth");if(user||guestMode){a.classList.add("hide");return}a.classList.remove("hide");const ps=profiles();if(!ps.length)amode="reg";
 let h=`<div style="max-width:480px;margin:0 auto;padding:16px"><div class="row"><b style="font-size:1.2em">🌱 NEERKATHIR AI</b><span><button style="background:none;border:0;color:var(--pr);font-weight:700;padding:8px" data-a="setLang('ta')">தமிழ்</button><button style="background:none;border:0;color:var(--pr);font-weight:700;padding:8px" data-a="setLang('en')">English</button></span></div>`;
 if(!CR)h+=`<div class="card warn">${_("Secure storage is not available in this browser. You can still use guest mode.","இந்த உலாவியில் பாதுகாப்பான சேமிப்பு இல்லை. விருந்தினர் முறையை பயன்படுத்தலாம்.")}</div>`;
 else if(amode==="login")h+=`<div class="card"><h2>${_("Farmer login","விவசாயி உள்நுழைவு")}</h2><label class="mu">${_("Farmer ID","விவசாயி எண்")}</label><select id="a-id">${ps.map(p=>`<option>${esc(p.id)}</option>`).join("")}</select><br><br>${field("a-pin",_("PIN","பின் எண்"),"","password",'inputmode="numeric" maxlength="6" autocomplete="off"')}<button class="btn" data-a="doLogin()">${_("Log in","உள்நுழை")}</button><div id="a-msg" class="mu" style="margin-top:8px"></div><button class="btn sec" data-a="setAmode('reg')">${_("Register as a new farmer","புதிய விவசாயியாக பதிவு செய்")}</button></div>`;
 else h+=`<div class="card"><h2>${_("New farmer registration","புதிய விவசாயி பதிவு")}</h2>${detailFields("r-",{crop:"tomato"})}${field("a-pin",_("Choose a 4–6 digit PIN","4–6 இலக்க பின் எண்ணை தேர்வு செய்க"),"","password",'inputmode="numeric" maxlength="6" autocomplete="off"')}${field("a-pin2",_("Confirm PIN","பின் எண்ணை உறுதிசெய்க"),"","password",'inputmode="numeric" maxlength="6" autocomplete="off"')}<label class="opt"><input type="checkbox" id="a-consent">${_("I agree to store my details on this phone, protected by my PIN.","என் விவரங்களை இந்த தொலைபேசியில் என் பின் எண் பாதுகாப்புடன் சேமிக்க ஒப்புக்கொள்கிறேன்.")}</label><button class="btn" data-a="doReg()">${_("Register","பதிவு செய்")}</button><div id="a-msg" class="mu" style="margin-top:8px"></div>${ps.length?`<button class="btn sec" data-a="setAmode('login')">${_("Back to login","உள்நுழைவுக்கு திரும்பு")}</button>`:""}</div>`;
 h+=`<button class="btn sec" data-a="guest()">${_("Continue as guest (nothing is saved)","விருந்தினராக தொடர் (எதுவும் சேமிக்கப்படாது)")}</button><p class="mu">🔒 ${_("Your details stay on this phone only and are encrypted. The PIN is never stored. If you forget it, the details cannot be recovered.","உங்கள் விவரங்கள் இந்த தொலைபேசியில் மட்டுமே, குறியாக்கத்துடன் இருக்கும். பின் எண் சேமிக்கப்படாது. மறந்தால் விவரங்களை மீட்க முடியாது.")}</p></div>`;
 a.innerHTML=h}
function setAmode(m){amode=m;authRender()}
function afterLogin(first){$("auth").classList.add("hide");img=null;cur=null;followOf=null;$("pv").classList.add("hide");$("result").classList.add("hide");$("imgmsg").textContent=T.nophoto[L];lastAct=Date.now();
 if(user&&CROPS[user.d.crop]){$("crop").value=user.d.crop;cropChg()}tab("scan");if(first)toast(_("Registered. Your Farmer ID is "+user.id+". Remember it.","பதிவு முடிந்தது. உங்கள் விவசாயி எண் "+user.id+". நினைவில் வைக்கவும்."))}
function guest(){guestMode=true;user=null;window._guest=[];afterLogin(false)}
function logout(auto){user=null;guestMode=false;cur=null;img=null;window._guest=[];try{speechSynthesis.cancel()}catch(e){}$("result").classList.add("hide");$("pv").classList.add("hide");amode="login";authRender();if(auto)toast(_("Logged out for safety.","பாதுகாப்புக்காக வெளியேற்றப்பட்டீர்கள்."))}
async function doReg(){const d=readDetails("r-"),pin=$("a-pin").value,pin2=$("a-pin2").value,e=checkDetails(d);if(e)return aerr(e);
 if(!/^\d{4,6}$/.test(pin)||/^(\d)\1+$/.test(pin)||"01234567890".includes(pin)||"98765432109".includes(pin))return aerr(_("Choose a harder PIN (not 1234 or 0000).","எளிதான பின் எண் வேண்டாம் (1234, 0000 போன்றவை)."));
 if(pin!==pin2)return aerr(_("PINs do not match.","பின் எண்கள் பொருந்தவில்லை."));if(!$("a-consent").checked)return aerr(_("Please tick the consent box.","ஒப்புதல் பெட்டியை தேர்வு செய்யவும்."));
 $("a-msg").textContent="…";try{d.created=new Date().toISOString().slice(0,10);const ps=profiles();let id;do{id="FM-"+(1000+crypto.getRandomValues(new Uint32Array(1))[0]%9000)}while(ps.some(x=>x.id===id));
  const salt=crypto.getRandomValues(new Uint8Array(16)),key=await keyFrom(pin,salt);ps.push({id,salt:b64(salt),blob:await seal(d,key)});LS.s("nk_profiles",JSON.stringify(ps));user={id,d,key};afterLogin(true)}catch(x){aerr("Error")}}
async function doLogin(){const id=$("a-id").value,pin=$("a-pin").value,p=profiles().find(x=>x.id===id);if(!p)return;let lk={};try{lk=JSON.parse(LS.g("nk_lk_"+id)||"{}")}catch(e){}lk.f=lk.f||0;lk.u=lk.u||0;
 if(Date.now()<lk.u)return aerr(_("Too many attempts. Wait "+Math.ceil((lk.u-Date.now())/1000)+" s.","அதிக முயற்சிகள். "+Math.ceil((lk.u-Date.now())/1000)+" வினாடி காத்திருக்கவும்."));
 $("a-msg").textContent="…";try{const key=await keyFrom(pin,unb64(p.salt)),d=await unseal(p.blob,key);LS.d("nk_lk_"+id);user={id,d,key};afterLogin(false)}
 catch(x){lk.f++;if(lk.f>=5)lk.u=Date.now()+Math.min(3600000,30000*Math.pow(2,lk.f-5));LS.s("nk_lk_"+id,JSON.stringify(lk));const left=Math.max(0,5-lk.f);aerr(_("Wrong PIN. Attempts left: "+left,"தவறான பின் எண். மீதமுள்ள முயற்சிகள்: "+left))}}
function profileView(){const v=$("v-profile");if(!user){v.innerHTML=`<div class="card"><p>${_("Guest mode: nothing is saved.","விருந்தினர் முறை: எதுவும் சேமிக்கப்படாது.")}</p><button class="btn" data-a="logout()">${_("Log in / register","உள்நுழை / பதிவு")}</button></div>`;return}
 v.innerHTML=`<div class="card"><div class="row"><h2>${esc(user.id)}</h2><span class="tag low">🔒 ${_("Encrypted on this phone","இந்த தொலைபேசியில் குறியாக்கம்")}</span></div>${detailFields("p-",user.d)}<button class="btn" data-a="saveProfile()">${_("Update details","விவரங்களை புதுப்பி")}</button><div id="p-msg" class="mu" style="margin-top:8px"></div></div>
 <div class="card"><h2>${_("Your data and privacy","உங்கள் தரவு மற்றும் தனியுரிமை")}</h2><ul class="mu"><li>${_("Details are encrypted (AES-256) with a key made from your PIN. The PIN is not stored.","விவரங்கள் உங்கள் பின் எண்ணால் உருவாக்கிய விசையுடன் குறியாக்கம் செய்யப்படுகின்றன (AES-256). பின் எண் சேமிக்கப்படாது.")}</li><li>${_("Nothing is sent anywhere. Data stays on this phone.","எதுவும் எங்கும் அனுப்பப்படாது. தரவு இந்த தொலைபேசியில் மட்டுமே.")}</li><li>${_("Scan records hold only your Farmer ID, crop, date and a small photo. They are not encrypted.","ஸ்கேன் பதிவுகளில் உங்கள் எண், பயிர், தேதி, சிறிய படம் மட்டுமே இருக்கும். அவை குறியாக்கம் செய்யப்படவில்லை.")}</li><li>${_("Automatic log-out after a few minutes of no use.","சில நிமிடங்கள் பயன்படுத்தாவிட்டால் தானாக வெளியேறும்.")}</li></ul>
 <button class="btn sec" data-a="logout()">${_("Log out","வெளியேறு")}</button><button class="btn sec" id="wipe" data-a="wipe()" style="color:var(--er);border-color:var(--er)">${_("Delete all my data","என் எல்லா தரவையும் அழி")}</button></div>`}
async function saveProfile(){const d=readDetails("p-"),e=checkDetails(d),m=$("p-msg");if(e){m.textContent=e;m.style.color="var(--er)";return}
 try{d.created=user.d.created;const ps=profiles(),p=ps.find(x=>x.id===user.id);p.blob=await seal(d,user.key);LS.s("nk_profiles",JSON.stringify(ps));user.d=d;toast(_("Saved","சேமிக்கப்பட்டது"))}catch(x){m.textContent="Error"}}
function wipe(){if(Date.now()-wipeArm>5000){wipeArm=Date.now();$("wipe").textContent=_("Tap again to delete everything","அனைத்தையும் அழிக்க மீண்டும் தட்டவும்");return}
 const id=user.id;LS.s("nk_profiles",JSON.stringify(profiles().filter(p=>p.id!==id)));LS.d("nk_recs_"+id);LS.d("nk_lk_"+id);logout();toast(_("All your data was deleted.","உங்கள் எல்லா தரவும் அழிக்கப்பட்டது."))}
["click","touchstart","keydown"].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now()},true));
setInterval(()=>{if(user&&Date.now()-lastAct>($("kiosk").checked?120000:300000))logout(true)},5000);
draw();guideInit();authRender();
try{if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}catch(e){}
</script></body></html>
